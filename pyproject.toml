[build-system]
requires = ["setuptools>=58", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contractor-hse-audit"
version = "0.2.0"
description = "Contractor HSE Document Audit System"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlmodel>=0.0.22",
  "sqlalchemy>=2.0.35",
  "psycopg[binary]>=3.2.1",
  "alembic>=1.13.2",
  "celery>=5.4.0",
  "redis>=5.0.8",
  "httpx>=0.27.0",
  "socksio>=1.0.0",
  "python-dotenv>=1.0.1",
  "openpyxl>=3.1.5",
  "boto3>=1.35.0",
  "python-multipart>=0.0.9",
  "tenacity>=9.0.0",
  "eval-type-backport>=0.2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.8",
  "mypy>=1.11.2"
]

[tool.setuptools]
packages = [
  "app",
  "app.api",
  "app.core",
  "app.db",
  "app.models",
  "app.schemas",
  "app.services",
  "app.llm",
  "app.llm.adapters",
  "app.llm.prompts",
  "app.llm.schemas",
  "app.rule_engine",
  "app.extractors",
  "app.reports",
  "app.tasks",
  "app.storage",
  "app.evaluation"
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
